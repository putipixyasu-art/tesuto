document.getElementById('save').onclick=()=>{const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tctx=tmp.getContext('2d');tctx.fillStyle='#fff';tctx.fillRect(0,0,W,H);tctx.drawImage(bg,0,0);tctx.drawImage(wc,0,0);tctx.lineCap='round';tctx.lineJoin='round';tctx.strokeStyle='#000';wires.forEach(w=>{if(w.p.length<2)return;tctx.lineWidth=w.w;tctx.beginPath();tctx.moveTo(w.p[0].x,w.p[0].y);w.p.slice(1).forEach(pt=>tctx.lineTo(pt.x,pt.y));tctx.stroke()});circuits.forEach(c=>{tctx.save();tctx.translate(c.x,c.y);if(c.t==='joint'){const s=c.s*2;tctx.drawImage(jointImg,-s/2,-s/2,s,s)}else{tctx.fillStyle='#fff';tctx.strokeStyle='#000';tctx.lineWidth=2;tctx.beginPath();tctx.arc(0,0,c.s,0,7);tctx.fill();tctx.stroke();if(c.t==='200V'){tctx.beginPath();tctx.arc(0,0,c.s*0.68,0,7);tctx.stroke()}tctx.fillStyle='#000';tctx.font=`bold ${c.s*0.8}px sans-serif`;tctx.textAlign='center';tctx.textBaseline='middle';tctx.fillText(c.n,0,1)}tctx.restore()});const a=document.createElement('a');a.download='配線図.png';a.href=tmp.toDataURL('image/png');a.click()};
document.getElementById('print').onclick=()=>{
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tctx=tmp.getContext('2d');
  tctx.fillStyle='#fff';tctx.fillRect(0,0,W,H);tctx.drawImage(bg,0,0);tctx.drawImage(wc,0,0);
  tctx.lineCap='round';tctx.lineJoin='round';tctx.strokeStyle='#000';
  wires.forEach(w=>{if(w.p.length<2)return;tctx.lineWidth=w.w;tctx.beginPath();tctx.moveTo(w.p[0].x,w.p[0].y);w.p.slice(1).forEach(pt=>tctx.lineTo(pt.x,pt.y));tctx.stroke()});
  circuits.forEach(c=>{tctx.save();tctx.translate(c.x,c.y);if(c.t==='joint'){const s=c.s*2;tctx.drawImage(jointImg,-s/2,-s/2,s,s)}else{tctx.fillStyle='#fff';tctx.strokeStyle='#000';tctx.lineWidth=2;tctx.beginPath();tctx.arc(0,0,c.s,0,7);tctx.fill();tctx.stroke();if(c.t==='200V'){tctx.beginPath();tctx.arc(0,0,c.s*0.68,0,7);tctx.stroke()}tctx.fillStyle='#000';tctx.font=`bold ${c.s*0.8}px sans-serif`;tctx.textAlign='center';tctx.textBaseline='middle';tctx.fillText(c.n,0,1)}tctx.restore()});
  const w=window.open('');w.document.write('<img src="'+tmp.toDataURL()+'" style="max-width:100%">');w.document.close();w.focus();w.print()
};
document.getElementById('pdf').onclick=()=>{
  document.getElementById('print').onclick()
};
function setActive(id){['load','white','wire','c100','c200','joint','undo','del','clear','save','pdf','print'].forEach(i=>{const b=document.getElementById(i);if(b)b.classList.remove('active')});if(id)document.getElementById(id).classList.add('active')}
function resize(){cv.width=innerWidth;cv.height=innerHeight-40;draw()}addEventListener('resize',resize);
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-px)/scale,y:(e.clientY-r.top-py)/scale}}
function save(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify({w:wires,c:circuits,b:bg.toDataURL(),wht:wc.toDataURL()}));hi=hist.length-1}
function load(s){const o=JSON.parse(s);wires=o.w;circuits=o.c;const bi=new Image();bi.onload=()=>{bgc.clearRect(0,0,W,H);bgc.drawImage(bi,0,0);draw()};bi.src=o.b;const wi=new Image();wi.onload=()=>{wcc.clearRect(0,0,W,H);wcc.drawImage(wi,0,0);draw()};wi.src=o.wht}
function snap(x,y){for(const c of circuits)if(Math.hypot(x-c.x,y-c.y)<28)return{x:c.x,y:c.y};return{x,y}}
function draw(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(scale,0,0,scale,px,py);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.drawImage(bg,0,0);ctx.drawImage(wc,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#000';wires.forEach(w=>{if(w.p.length<2)return;ctx.lineWidth=w.w;ctx.beginPath();ctx.moveTo(w.p[0].x,w.p[0].y);w.p.slice(1).forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.stroke()});if(cur){ctx.strokeStyle='#0ea5e9';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cur.p[0].x,cur.p[0].y);cur.p.slice(1).forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.stroke();ctx.setLineDash([])}circuits.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);if(c===sel){ctx.shadowColor='#0ea5e9';ctx.shadowBlur=8}if(c.t==='joint'){const s=c.s*2;ctx.drawImage(jointImg,-s/2,-s/2,s,s)}else{ctx.fillStyle='#fff';ctx.strokeStyle=c===sel?'#0ea5e9':'#000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,c.s,0,7);ctx.fill();ctx.stroke();if(c.t==='200V'){ctx.beginPath();ctx.arc(0,0,c.s*0.68,0,7);ctx.stroke()}ctx.fillStyle='#000';ctx.font=`bold ${c.s*0.8}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.n,0,1)}ctx.restore()});ctx.restore()}
function hit(x,y){for(let i=circuits.length-1;i>=0;i--){const c=circuits[i];if(Math.hypot(x-c.x,y-c.y)<c.s+6)return c}return null}
cv.onmousedown=e=>{const w=toWorld(e);if(e.shiftKey||mode==='pan'){drag='pan';last={x:e.clientX,y:e.clientY};return}const h=hit(w.x,w.y);if(h){sel=h;drag=h;last={x:e.clientX,y:e.clientY};draw();return}sel=null;if(mode==='white'){wcc.beginPath();wcc.moveTo(w.x,w.y);drag='white'}if(mode==='wire'){const p=snap(w.x,w.y);if(!cur)cur={p:[p],w:+document.getElementById('wsize').value};else cur.p.push(p);draw()}if(mode==='circuit'){circuits.push({n:document.getElementById('cnum').value,t:mode.t,x:w.x,y:w.y,s:+document.getElementById('csize').value});mode='pan';setActive(null);save();draw()}if(mode==='joint'){circuits.push({n:'JB',t:'joint',x:w.x,y:w.y,s:+document.getElementById('csize').value});mode='pan';setActive(null);save();draw()}}
cv.onmousemove=e=>{const w=toWorld(e);if(drag==='pan'){px+=e.clientX-last.x;py+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};draw()}else if(drag&&drag!=='pan'&&drag!=='white'){drag.x+=(e.clientX-last.x)/scale;drag.y+=(e.clientY-last.y)/scale;last={x:e.clientX,y:e.clientY};draw()}else if(drag==='white'){wcc.lineTo(w.x,w.y);wcc.stroke();draw()}}
addEventListener('mouseup',()=>{if(drag==='white')save();if(drag&&drag!=='pan'&&drag!=='white')save();drag=null});
cv.ondblclick=()=>{if(cur&&cur.p.length>1){wires.push(cur);save()}cur=null;draw()};
cv.onwheel=e=>{e.preventDefault();const d=e.deltaY>0?0.9:1.1;const w=toWorld(e);scale*=d;px=w.x*scale*-1+e.clientX;py=w.y*scale*-1+e.clientY;draw()};
document.getElementById('load').onclick=()=>document.getElementById('fi').click();document.getElementById('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{bgc.fillStyle='#fff';bgc.fillRect(0,0,W,H);const s=Math.min(W/im.width,H/im.height)*0.95;bgc.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s);save();draw()};im.src=URL.createObjectURL(f);fi.value=''};
document.getElementById('white').onclick=()=>{mode=mode==='white'?'pan':'white';document.getElementById('white').classList.toggle('active')};
document.getElementById('wire').onclick=()=>{mode=mode==='wire'?'pan':'wire';document.getElementById('wire').classList.toggle('active');cur=null};
document.getElementById('c100').onclick=()=>{mode='circuit';mode.t='100V';setActive('c100')};document.getElementById('c200').onclick=()=>{mode='circuit';mode.t='200V';setActive('c200')};document.getElementById('joint').onclick=()=>{mode='joint';setActive('joint')};
document.getElementById('undo').onclick=()=>{if(hi>0){hi--;load(hist[hi])}};
document.getElementById('del').onclick=()=>{if(sel){circuits=circuits.filter(c=>c!==sel);sel=null;save();draw()}};
document.getElementById('clear').onclick=()=>{if(confirm('全消去?')){wires=[];circuits=[];wcc.clearRect(0,0,W,H);save();draw()}};
resize();save();
</script></body></html>
