<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電力申請 フォーム版（地図なし）</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f3f4f6;
}
.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:16px;
}
h1{
  font-size:18px;
  margin-bottom:10px;
}
.f{
  margin-bottom:10px;
}
.f label{
  font-size:12px;
  font-weight:700;
  display:block;
}
.f input,.f select,.f textarea{
  width:100%;
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
button{
  height:36px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:#fff;
}
.topbtns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>電力申請 フォーム版</h1>

<div class="topbtns">
<button onclick="save()">保存</button>
<button onclick="load()">読込</button>
<button onclick="print()">印刷</button>
<button onclick="clearAll()">全削除</button>
</div>

<div class="f"><label>現場名</label><input id="genba"></div>
<div class="f"><label>会社名</label><input id="company"></div>
<div class="f"><label>担当者</label><input id="tanto"></div>
<div class="f"><label>住所</label><input id="jusho" value="宮城県"></div>

<div class="grid2">
<div class="f">
<label>工事種別</label>
<select id="koji">
<option>本設</option>
<option>仮設</option>
</select>
</div>

<div class="f">
<label>供給方式</label>
<select id="kyokyu">
<option>単相2線式 100V</option>
<option selected>単相3線式 100/200V</option>
<option>三相3線式 200V</option>
</select>
</div>
</div>

<div class="grid2">
<div class="f">
<label>契約種別</label>
<select id="keiyaku">
<option>相談</option>
<option>従量電灯B</option>
<option>従量電灯C</option>
<option>低圧電力</option>
</select>
</div>

<div class="f">
<label>契約容量</label>
<select id="amp">
<option>30A</option>
<option>40A</option>
<option>50A</option>
<option>60A</option>
<option>6kVA</option>
<option>10kVA</option>
</select>
</div>
</div>

<div class="f">
<label>引込線</label>
<div class="grid2">
<select id="dv">
<option>DV2線</option>
<option selected>DV3線</option>
</select>
<select id="sz">
<option>3.2mm</option>
<option>22mm²</option>
<option>38mm²</option>
</select>
</div>
<input id="dv_len" placeholder="長さ(m)">
</div>

<div class="grid2">
<div class="f"><label>引込柱番号</label><input id="hikikomi_basho"></div>
<div class="f"><label>トランス柱番号</label><input id="trans_basho"></div>
</div>

<div class="f"><label>備考</label><textarea id="biko"></textarea></div>

</div>

<script>

function getData(){
  return {
    genba:genba.value,
    company:company.value,
    tanto:tanto.value,
    jusho:jusho.value,
    koji:koji.value,
    kyokyu:kyokyu.value,
    keiyaku:keiyaku.value,
    amp:amp.value,
    dv:dv.value,
    sz:sz.value,
    dv_len:dv_len.value,
    hikikomi_basho:hikikomi_basho.value,
    trans_basho:trans_basho.value,
    biko:biko.value
  }
}

function setData(d){
  Object.keys(d).forEach(k=>{
    if(window[k]) window[k].value=d[k]
  })
}

function save(){
  const blob=new Blob([JSON.stringify(getData(),null,2)]);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download="申請.json";
  a.click();
}

function load(){
  const i=document.createElement('input');
  i.type='file';
  i.onchange=e=>{
    const f=e.target.files[0];
    const r=new FileReader();
    r.onload=ev=>{
      setData(JSON.parse(ev.target.result))
    }
    r.readAsText(f)
  }
  i.click();
}

function clearAll(){
  if(confirm("全部消す？")){
    document.querySelectorAll("input,textarea").forEach(e=>e.value="")
  }
}

</script>

</body>
</html>
